<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Search results: a unique title, and a 50 to 160 character description of the page. -->
    <title>Example: what the site does, in a few words</title>
    <meta name="description" content="One or two plain sentences that say what someone gets from this page." />
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Link previews. og:url matches the canonical link; the image is 1200 × 630 in public/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Example" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:title" content="Example: what the site does, in a few words" />
    <meta property="og:description" content="One or two plain sentences that say what someone gets from this page." />
    <meta property="og:image" content="https://www.example.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="What the image shows" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- What the page is about, as schema.org data: WebSite, WebApplication, Person, … -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Example",
        "url": "https://www.example.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
